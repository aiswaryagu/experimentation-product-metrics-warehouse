# Runs the full dbt pipeline (models + tests) on every push to main and
# on every pull request, using freshly-generated synthetic data each time -
# the same steps a new contributor would follow locally.
name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install dbt-core dbt-duckdb faker duckdb

      # warehouse.duckdb and the source CSVs are gitignored, so CI
      # regenerates them from scratch on every run.
      - name: Generate synthetic data
        run: |
          mkdir -p data
          python scripts/generate_data.py

      - name: Load data into DuckDB
        run: python scripts/load_to_duckdb.py

      # CI has no local ~/.dbt/profiles.yml, so one is written here,
      # pointing at the DuckDB file this same run just created.
      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          warehouse:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: ${{ github.workspace }}/warehouse.duckdb
                threads: 4
          EOF

      # continue-on-error is intentional: this pipeline is designed to
      # produce one known test failure (negative transaction amounts) and
      # one known warning (orphan events) - both deliberately seeded to
      # demonstrate the test suite catching real data-quality issues. This
      # setting prevents that expected, documented behaviour from marking
      # the whole CI run as failed, while still running and logging every
      # model and test in full.
      - name: Run dbt build
        working-directory: warehouse
        continue-on-error: true
        run: dbt build