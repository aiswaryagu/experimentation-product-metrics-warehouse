version: 2

models:
  - name: fct_funnel_conversion
    columns:
      - name: funnel_step
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['page_view', 'signup', 'add_to_cart', 'checkout_start', 'checkout_complete']
      - name: sessions_reached
        tests:
          - not_null

  - name: fct_retention_cohorts
    columns:
      - name: retention_pct
        tests:
          - not_null

  - name: fct_ltv
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: ltv
        tests:
          - not_null

  - name: fct_ltv_by_cohort
    columns:
      - name: cohort_week
        tests:
          - unique
          - not_null
      - name: avg_ltv_per_user
        tests:
          - not_null

  - name: fct_experiment_results
    columns:
      - name: variant
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['control', 'treatment']
      - name: session_completion_rate_pct
        tests:
          - not_null